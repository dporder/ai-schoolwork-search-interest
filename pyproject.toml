[project]
name = "ai-schoolwork-search-interest"
version = "1.0.0"
description = "Code and data for 'Who Turns to AI for Schoolwork?'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dan Porder", email = "danporder@gmail.com" }
]
keywords = [
    "generative AI", "education", "digital divide",
    "Google Trends", "academic integrity"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
